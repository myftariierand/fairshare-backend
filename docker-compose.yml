services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./src:/usr/src/app/src
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run start:dev"
    environment:
      - PORT=3000
      - NODE_ENV=development

  db:
    container_name: database
    image: postgres
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: example_user
      POSTGRES_PASSWORD: example_pass
      POSTGRES_DB: example_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U example_user -d example_db']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - '8080:8080'
